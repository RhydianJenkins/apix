name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check flake (builds, vets, and tests)
      run: nix flake check

    - name: Build with Nix
      run: nix build

    - name: Smoke test binary
      run: ./result/bin/apix --help
